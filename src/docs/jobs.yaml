tags:
  - name: Jobs
    description: Endpoints para la gestión de trabajos en MiniWorks

paths:
  /api/jobs/all:
    get:
      summary: Obtiene todos los trabajos publicados
      tags: [Jobs]
      responses:
        '200':
          description: Lista de trabajos cargada correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    company:
                      type: string
                    location:
                      type: string
                    salary:
                      type: number
                    createdBy:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    applicants:
                      type: array
                      items:
                        type: string
        '500':
          description: Error al cargar trabajos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/jobs/search:
    get:
      summary: Busca trabajos por palabra clave
      tags: [Jobs]
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: Palabra clave para buscar trabajos
      responses:
        '200':
          description: Resultados encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    company:
                      type: string
                    location:
                      type: string
        '400':
          description: Faltó la palabra clave
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Error al buscar trabajos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/jobs/{id}:
    get:
      summary: Obtiene los detalles de un trabajo específico
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del trabajo
      responses:
        '200':
          description: Detalles del trabajo
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  company:
                    type: string
                  location:
                    type: string
                  salary:
                    type: number
                  createdBy:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  applicants:
                    type: array
                    items:
                      type: string
        '404':
          description: Trabajo no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/jobs/create:
    post:
      summary: Crea un nuevo trabajo (solo empleadores)
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - company
              properties:
                title:
                  type: string
                  example: Desarrollador Backend
                description:
                  type: string
                  example: Trabajo remoto para mantenimiento de API Node.js
                company:
                  type: string
                  example: Tech Solutions
      responses:
        '201':
          description: Trabajo creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  job:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      company:
                        type: string
                      createdBy:
                        type: string
        '403':
          description: Solo empleadores pueden crear trabajos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Error al crear trabajo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

