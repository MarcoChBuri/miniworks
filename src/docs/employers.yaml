tags:
  - name: Employers
    description: Endpoints relacionados con empleadores, gestión de postulaciones, reseñas y publicación de trabajos.

paths:
  /api/employers/jobs:
    get:
      summary: Obtiene los trabajos publicados por el empleador autenticado
      tags: [Employers]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de trabajos del empleador
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    company:
                      type: string
                    applicants:
                      type: array
                      items:
                        type: string
        500:
          description: Error al obtener trabajos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/employers/jobs/{id}/applications:
    get:
      summary: Obtiene las postulaciones de un trabajo específico
      tags: [Employers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del trabajo
      responses:
        200:
          description: Lista de postulaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    jobId:
                      type: string
                    studentId:
                      type: string
                    status:
                      type: string
                      enum: [PENDIENTE, ACEPTADO, RECHAZADO]
                    appliedAt:
                      type: string
                      format: date-time
                    student:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
        403:
          description: Acceso denegado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Error al obtener postulaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/employers/reviews:
    get:
      summary: Obtiene todas las reseñas del empleador autenticado
      tags: [Employers]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de reseñas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    calificacion:
                      type: number
                    comentario:
                      type: string
                    studentId:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        500:
          description: Error al obtener reseñas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/employers/reviews/{studentId}/send:
    post:
      summary: Crea una reseña para un estudiante
      tags: [Employers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
          description: ID del estudiante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - calificacion
                - comentario
              properties:
                calificacion:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 5
                comentario:
                  type: string
                  example: "Excelente desempeño en el proyecto."
      responses:
        201:
          description: Reseña creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      calificacion:
                        type: number
                      comentario:
                        type: string
                      studentId:
                        type: string
                      employerId:
                        type: string
        403:
          description: Solo empleadores pueden dejar reseñas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Error al dejar reseña
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

