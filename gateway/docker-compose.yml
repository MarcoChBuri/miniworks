version: '3.9'

services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kong-net

  miniworks:
    build:
      context: /home/marcoch/Imágenes/edison/miniworks
    container_name: miniworks-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URL=mongodb://mongo:27017/MiniWorks
      - JWT_SECRET=este-es-un-secreto-muy-dificil-de-adivinar-1234
      - JWT_EXPIRES_IN=1h
    depends_on:
      - mongo
    networks:
      - kong-net
      
  validadoruniversidad:
    build:
      context: /home/marcoch/Imágenes/edison/UniversityValitator
    container_name: validador-universidad
    ports:
      - "9000:9000"
    networks:
      - kong-net

  kong:
    image: kong/kong-gateway:3.7.0.0
    container_name: kong-gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_LOG_LEVEL=info
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    depends_on:
      - miniworks
      - validadoruniversidad
    networks:
      - kong-net

networks:
  kong-net:
    driver: bridge

volumes:
  mongo-data:
