tags:
  - name: Students
    description: Endpoints para gestión y acciones de estudiantes en MiniWorks

paths:
  /api/students/{userId}/history:
    get:
      summary: Ver historial de trabajos del estudiante
      tags: [Students]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: ID del estudiante
      responses:
        '200':
          description: Historial obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    company:
                      type: string
                    status:
                      type: string
                    appliedAt:
                      type: string
                      format: date-time
        '500':
          description: Error al cargar historial
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/students/reviews/{id}:
    get:
      summary: Ver reseñas del estudiante
      tags: [Students]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del estudiante
      responses:
        '200':
          description: Reseñas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    calificacion:
                      type: number
                    comentario:
                      type: string
                    employerId:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        '500':
          description: Error al cargar reseñas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/students/jobs/available:
    get:
      summary: Ver trabajos disponibles para estudiantes
      tags: [Students]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de trabajos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    company:
                      type: string
                    location:
                      type: string
        '403':
          description: Solo estudiantes pueden ver trabajos disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Error al obtener trabajos disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/students/{employerId}/reviews:
    post:
      summary: Crea una reseña para un empleador
      tags: [Students]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: employerId
          required: true
          schema:
            type: string
          description: ID del empleador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - calificacion
                - comentario
              properties:
                calificacion:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 4
                comentario:
                  type: string
                  example: "Buena empresa, recomendable."
      responses:
        '201':
          description: Reseña creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      calificacion:
                        type: number
                      comentario:
                        type: string
                      studentId:
                        type: string
                      employerId:
                        type: string
        '403':
          description: Solo estudiantes pueden dejar reseñas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Error al dejar la reseña
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

